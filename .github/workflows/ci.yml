name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --release --all-features
      - run: cargo test --release --doc --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check --target wasm32-unknown-unknown --no-default-features

  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cd fuzz && cargo +nightly fuzz run fuzz_timestamp -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_timestamp_tz -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_date -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_time -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_bool -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_pg_bytea_hex -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_i64 -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_f64 -- -dict=sql_scalars.dict -max_len=100 -runs=100
      - run: cd fuzz && cargo +nightly fuzz run fuzz_decimal -- -dict=sql_scalars.dict -max_len=100 -runs=100
  msrv:
    name: Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-features
